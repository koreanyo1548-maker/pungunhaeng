# PR checks: the same fast code checks for every PR, whichever tool made it (docs/workflow.md, section 3): types,
# format and builds. Read-only: it never commits. The single-file build is uploaded so the PR can be played.
name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          npm ci
          python -m pip install -r tools/requirements-assets.txt

      # Fast code checks only (docs/workflow.md, section 3). The game tests that open a browser (tests/e2e,
      # tests/equivalence) are run by hand for large structural changes, not on every PR.
      - name: Types and format
        run: |
          npm run typecheck
          npm run format:check
      - name: Builds and image resources
        run: |
          npm run build
          python tools/convert-webp.py --check
          npm run build:single

      - name: Upload the playable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pungunhaeng-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist-single/index.html
          retention-days: 14
          if-no-files-found: ignore
