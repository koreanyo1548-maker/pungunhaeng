name: WebP resources

on:
  push:
    branches: [codex/webp-resources]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webp-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert-and-verify:
    # Generate commits only on work branches, never directly on main or a tag.
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install conversion, game and browser dependencies
        run: |
          python -m pip install -r tools/requirements-assets.txt
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Capture current build and resize only included WebP
        run: |
          mkdir -p test-results
          npm run build
          npm run build:single
          cp dist-single/index.html test-results/fullsize-before.html
          python tools/convert-webp.py
      - name: Validate builds, geometry, flow and mobile browsers
        env:
          SCREENSHOT_DIR: test-results/art
        run: |
          npm run typecheck
          npm run build
          npm run build:single
          python tools/convert-webp.py --check
          npm run test:e2e
          npm run test:ui
          node tests/e2e/mobile-image-geometry.mjs
          node tests/e2e/ambient-art.mjs
          node tests/e2e/skill-art.mjs
          node tests/e2e/webp-assets.mjs
      - name: Commit verified runtime assets
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add src/assets/images src/assets/image-dimensions.json docs/webp-report.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Generate verified mobile-resolution WebP runtime resources"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Resource size report
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open("docs/webp-report.json"))["build"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"WebP: {report['fileCount']} files, {report['fullsizeWebpBytes']} → {report['mobileWebpBytes']} bytes "
                            f"({report['reductionPercent']}% smaller). Resized pixels verified; originals and unused WebP unchanged.\n")
          PY
